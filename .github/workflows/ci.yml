name: Verify ToolMesh
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy gateway control_plane shared services benchmarks
      - run: npm --prefix apps/web ci
      - run: npm --prefix apps/web run build
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: HF_HUB_DISABLE_XET=1 uv run --locked python -m gateway.embeddings --output .models/discovery
      - name: Bootstrap and verify real dependencies
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up --build -d --wait
          docker compose run --rm migrate
      - run: TOOLMESH_EXPECT_DRAFT=1 npm --prefix apps/web run test:e2e -- overview.spec.ts workspace.spec.ts provider.spec.ts
      - run: npm --prefix apps/web run test:e2e -- refund.spec.ts crawler.spec.ts
      - run: npm --prefix apps/web run test:e2e -- evaluations.spec.ts
      - run: npm --prefix apps/web run test:e2e -- access.spec.ts
      - name: Start a fresh database for Python integration tests
        run: |
          docker compose down
          docker compose -p toolmesh-integration up --build -d --wait
      - run: TOOLMESH_TEST_COMPOSE_PROJECT=toolmesh-integration TOOLMESH_TEST_REQUIRE_MODEL=1 TOOLMESH_TEST_MUTATE_POLICY=1 TOOLMESH_TEST_API=http://127.0.0.1:8000 uv run --locked pytest -q
      - name: Scan working tree for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.0 dir /repo --redact --no-banner --config /repo/.gitleaks.toml
      - name: Show Compose statuses
        if: failure()
        run: |
          docker compose ps -a
          docker compose -p toolmesh-integration ps -a
      - name: Stop sandbox
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down
            docker compose -p toolmesh-integration down
          fi
