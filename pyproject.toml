[project]
name = "toolmesh-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "fastmcp>=3,<4",
  "httpx>=0.28,<1",
  "pydantic-settings>=2,<3",
  "redis>=6,<9",
  "sqlalchemy[asyncio]>=2,<3",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["httpx2", "pytest", "ruff", "mypy"]

[tool.mypy]
plugins = ["pydantic.mypy"]
check_untyped_defs = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
pythonpath = ["."]
